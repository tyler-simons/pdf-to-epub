services:
  leaf:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      LEAF_PUBLIC: ${LEAF_PUBLIC:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      LEAF_PUBLIC_HOSTNAME: ${LEAF_PUBLIC_HOSTNAME:-}
      LEAF_ACCESS_SECRET: ${LEAF_ACCESS_SECRET:-}
      LEAF_DATA_DIR: /data
      LEAF_AI_ENABLED: ${LEAF_AI_ENABLED:-false}
      LEAF_AI_BUDGET_MICROUSD: ${LEAF_AI_BUDGET_MICROUSD:-10000000}
      LEAF_AI_PER_JOB_MICROUSD: ${LEAF_AI_PER_JOB_MICROUSD:-100000}
      LEAF_DAILY_JOBS: ${LEAF_DAILY_JOBS:-20}
      LEAF_PER_CLIENT_DAILY_JOBS: ${LEAF_PER_CLIENT_DAILY_JOBS:-3}
      LEAF_DAILY_PROCESSING_SECONDS: ${LEAF_DAILY_PROCESSING_SECONDS:-3600}
      LEAF_JOB_TIMEOUT_SECONDS: ${LEAF_JOB_TIMEOUT_SECONDS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: ["leaf-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 3g
    cpus: 2
    pids_limit: 96
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  leaf-data:
